<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLMARvista 2D - Windows UI</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <style>
        :root {
            --window-bg: #f3f6fa;
            --panel-bg: #ffffff;
            --bar-bg: rgba(255, 255, 255, 0.94);
            --border: #cbd5e1;
            --text: #1f2937;
            --muted: #64748b;
            --accent: #0067c0;
            --accent-soft: #e5f1fb;
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
            --font: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: var(--font);
            color: var(--text);
            background: radial-gradient(circle at 50% 0%, #eef5fc 0%, #d7e3ef 100%);
        }

        body { display: flex; flex-direction: column; }

        #app-topbar {
            flex: 0 0 auto;
            background: var(--bar-bg);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(16px);
            z-index: 2;
        }

        .titlebar {
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; }
        .brand-mark { color: var(--accent); font-size: 17px; }
        .titlebar-left { display: flex; align-items: center; gap: 18px; min-width: 0; }
        .app-nav { display: flex; align-items: center; gap: 4px; overflow-x: auto; white-space: nowrap; }
        .app-nav a { padding: 4px 7px; color: #475569; border-radius: 4px; text-decoration: none; font-size: 11px; }
        .app-nav a:hover, .app-nav a.active { color: #075b9e; background: var(--accent-soft); }
        .window-state { color: var(--muted); font-size: 11px; }
        .ui-switch { display: flex; align-items: center; gap: 7px; color: #475569; font-size: 11px; cursor: pointer; }
        .ui-switch input { accent-color: var(--accent); cursor: pointer; }

        .ribbon {
            min-height: 68px;
            display: flex;
            align-items: stretch;
            gap: 8px;
            padding: 6px 12px;
            overflow-x: auto;
        }

        .ribbon-group {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 10px 0 2px;
            border-right: 1px solid #e2e8f0;
        }

        .ribbon-group:last-child { border-right: 0; }

        .ribbon-command {
            min-width: 74px;
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 4px 8px;
            color: #334155;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            white-space: nowrap;
        }

        .ribbon-command:hover { background: var(--accent-soft); border-color: #b7d4ee; color: #075b9e; }
        .ribbon-command:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .command-icon { font-size: 18px; line-height: 1; color: var(--accent); }

        #workspace {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            padding: 10px;
        }

        #app-frame {
            width: 100%;
            height: 100%;
            display: block;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-bg);
            box-shadow: var(--shadow);
        }

        #statusbar {
            flex: 0 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 12px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.88);
            border-top: 1px solid var(--border);
            font-size: 11px;
        }

        .status-ready { color: #18794e; font-weight: 650; }
        .status-right { display: flex; gap: 14px; }

        @media (max-width: 720px) {
            .ribbon { min-height: 60px; }
            .ribbon-command { min-width: 62px; height: 44px; font-size: 10px; }
            .command-icon { font-size: 15px; }
            .window-state, .status-right { display: none; }
        }
    </style>
</head>
<body>
    <header id="app-topbar">
        <div class="titlebar">
            <div class="titlebar-left">
                <div class="brand"><span class="brand-mark">[C]</span><span>COLMARvista</span></div>
                <nav class="app-nav" aria-label="COLMARvista applications">
                    <a class="active" href="index_windows_ui.html">2D</a>
                    <a href="index_1d.html">1D</a>
                    <a href="index_2d_3dview.html">2D 3D view</a>
                    <a href="index_3d.html">3D</a>
                    <a href="index_document.html" target="_blank" rel="noopener">Document</a>
                    <a href="about.html">About</a>
                    <a href="index.html">Old UI</a>
                </nav>
            </div>
            <label class="ui-switch" title="Switch between the Windows-style UI and the original interface">
                <input id="ui-mode-toggle" type="checkbox" checked>
                <span>Windows UI</span>
            </label>
        </div>
        <nav class="ribbon" aria-label="Application commands">
            <div class="ribbon-group">
                <button class="ribbon-command" type="button" data-command="save" title="Save current session">
                    <span class="command-icon">[S]</span><span>Save session</span>
                </button>
                <button class="ribbon-command" type="button" data-command="load" title="Load a saved session">
                    <span class="command-icon">[L]</span><span>Load session</span>
                </button>
            </div>
            <div class="ribbon-group">
                <button class="ribbon-command" type="button" data-command="fid" title="Open Bruker time-domain processing">
                    <span class="command-icon">[F]</span><span>FID process</span>
                </button>
                <button class="ribbon-command" type="button" data-command="spectrum" title="Select FT2 spectrum files">
                    <span class="command-icon">[2D]</span><span>Load FT2</span>
                </button>
            </div>
            <div class="ribbon-group">
                <button class="ribbon-command" type="button" data-command="pseudo3d" title="Open pseudo-3D and fitting tools">
                    <span class="command-icon">[3D]</span><span>Pseudo-3D</span>
                </button>
                <button class="ribbon-command" type="button" data-command="transfer" title="Open assignment transfer tools">
                    <span class="command-icon">[A]</span><span>Transfer</span>
                </button>
            </div>
            <div class="ribbon-group">
                <button class="ribbon-command" type="button" data-command="peaks" title="Show or hide the peak table">
                    <span class="command-icon">[P]</span><span>Peak table</span>
                </button>
                <button class="ribbon-command" type="button" data-command="log" title="Show processing log">
                    <span class="command-icon">[=]</span><span>Processing log</span>
                </button>
            </div>
            <div class="ribbon-group">
                <button class="ribbon-command" type="button" data-command="reset" title="Reload the application workspace">
                    <span class="command-icon">[R]</span><span>Reset view</span>
                </button>
            </div>
        </nav>
    </header>

    <main id="workspace">
        <iframe id="app-frame" src="index.html" title="COLMARvista 2D application"></iframe>
    </main>

    <footer id="statusbar">
        <span>Workspace: <strong>2D spectrum analysis</strong></span>
        <span class="status-ready">Application ready</span>
        <span class="status-right"><span>Native processing controls</span><span>Windows UI</span></span>
    </footer>

    <script>
        const frame = document.getElementById("app-frame");

        function appDocument() {
            return frame.contentDocument || frame.contentWindow.document;
        }

        function appElement(id) {
            return appDocument().getElementById(id);
        }

        function clickAppElement(id) {
            const element = appElement(id);
            if (element) element.click();
        }

        function togglePanel(id) {
            const element = appElement(id);
            if (element) element.classList.toggle("windows-panel-hidden");
        }

        function setSectionHidden(element, hidden) {
            element.classList.toggle("windows-section-hidden", hidden);
            if (hidden) {
                element.style.setProperty("display", "none", "important");
            } else {
                element.style.removeProperty("display");
            }
        }

        function toggleSection(id, buttonId) {
            const element = appElement(id);
            if (!element) return;
            const isHidden = !element.classList.contains("windows-section-hidden");
            setSectionHidden(element, isHidden);
            if (!isHidden && buttonId) {
                const button = appElement(buttonId);
                if (button && button.innerText.trim() === "+") button.click();
            }
        }

        function openSection(id, buttonId) {
            const element = appElement(id);
            if (!element) return;
            setSectionHidden(element, false);
            if (buttonId) {
                const button = appElement(buttonId);
                if (button && button.innerText.trim() === "+") button.click();
            }
        }

        function styleEmbeddedApp() {
            const documentRef = appDocument();
            if (!documentRef || documentRef.getElementById("windows-ui-theme")) return;

            const theme = documentRef.createElement("style");
            theme.id = "windows-ui-theme";
            theme.textContent = `
                html, body { background: #f8fafc !important; }
                #navbar-placeholder { display: none !important; }
                #body { min-width: 0 !important; width: 100% !important; margin: 0 !important; align-items: stretch !important; }
                #section1 { width: auto !important; padding: 12px 18px !important; background: #eef5fc !important; border-bottom: 1px solid #cbd5e1 !important; }
                #section1 h1 { margin: 4px 0 !important; font-size: 20px !important; color: #1e3a5f !important; }
                #section1 h2 { margin: 4px 0 8px !important; font-size: 12px !important; color: #64748b !important; }
                #section1 h3 { margin: 0 !important; font-size: 12px !important; }
                #section2 { min-width: 0 !important; width: 100% !important; margin: 0 !important; padding: 10px !important; }
                #section2 > .drop-area-neighbor, #section2 > .drop-area, #assignment_area, #spectra_list { width: 100% !important; max-width: none !important; margin: 6px 0 !important; border-color: #cbd5e1 !important; border-radius: 6px !important; background: #fff !important; box-shadow: 0 2px 7px rgba(15,23,42,.06) !important; }
                #load_and_save, #fid_file_area, #file_area, #pseudo3d_area, #assignment_area, #spectra_list { padding: 8px 12px !important; }
                #fid_file_area.windows-section-hidden, #file_area.windows-section-hidden, #pseudo3d_area.windows-section-hidden, #assignment_area.windows-section-hidden { display: none !important; }
                #file_area.windows-section-hidden { visibility: hidden !important; }
                #load_and_save.windows-section-hidden { display: none !important; }
                #plot { width: 100% !important; padding: 10px !important; border-color: #94a3b8 !important; border-radius: 6px !important; background: #fff !important; }
                #plot { width: calc(100% - 390px) !important; margin-left: 0 !important; margin-right: 390px !important; }
                #load_and_save { position: fixed !important; top: 24px !important; left: 50% !important; transform: translateX(-50%) !important; width: 440px !important; min-height: 0 !important; margin: 0 !important; padding: 16px !important; z-index: 9999 !important; background: #fff !important; border: 1px solid #cbd5e1 !important; border-radius: 7px !important; box-shadow: 0 12px 32px rgba(15,23,42,.22) !important; }
                #section2 > #fid_file_area, #section2 > #file_area, #section2 > #pseudo3d_area, #section2 > #assignment_area { position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; width: min(760px, calc(100% - 32px)) !important; max-height: calc(100% - 32px) !important; overflow: auto !important; margin: 0 !important; padding: 16px !important; z-index: 9999 !important; background: #fff !important; border: 1px solid #94a3b8 !important; border-radius: 7px !important; box-shadow: 0 12px 32px rgba(15,23,42,.24) !important; }
                #peak_area { display: flex !important; position: fixed !important; top: 10px !important; right: 12px !important; width: 360px !important; height: calc(100% - 250px) !important; min-width: 280px !important; min-height: 220px !important; padding: 0 !important; margin: 0 !important; z-index: 9997 !important; background: #fff !important; border: 1px solid #cbd5e1 !important; border-radius: 7px !important; box-shadow: 0 8px 24px rgba(15,23,42,.16) !important; }
                #peak_area.windows-panel-hidden, #log_area.windows-panel-hidden { display: none !important; }
                #peak_area > div { padding: 8px 10px !important; background: #e8eef5 !important; border-bottom: 1px solid #cbd5e1 !important; }
                #peak_area table { font-size: 11px !important; }
                #log_area { top: auto !important; right: 12px !important; bottom: 12px !important; left: auto !important; width: 360px !important; height: 220px !important; border-radius: 7px !important; z-index: 9998 !important; }
                button, input, select { font-family: inherit !important; }
            `;
            documentRef.head.appendChild(theme);
            ["load_and_save", "fid_file_area", "file_area", "pseudo3d_area", "assignment_area"].forEach(id => {
                const element = documentRef.getElementById(id);
                if (element) setSectionHidden(element, true);
            });
            const peakArea = documentRef.getElementById("peak_area");
            if (peakArea) peakArea.classList.add("windows-panel-hidden");
            const logArea = documentRef.getElementById("log_area");
            if (logArea) logArea.classList.add("windows-panel-hidden");

            const ft2Input = documentRef.getElementById("userfile");
            const ft2Form = documentRef.getElementById("ft2_file_form");
            if (ft2Input) {
                ft2Input.addEventListener("change", () => {
                    const fileArea = documentRef.getElementById("file_area");
                    if (fileArea) setSectionHidden(fileArea, true);
                    if (ft2Input.files && ft2Input.files.length > 0 && ft2Form) {
                        if (typeof ft2Form.requestSubmit === "function") {
                            ft2Form.requestSubmit();
                        } else {
                            ft2Form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
                        }
                    }
                });
            }

            const fidForm = documentRef.getElementById("fid_file_form");
            if (fidForm) {
                fidForm.addEventListener("submit", () => {
                    const fidArea = documentRef.getElementById("fid_file_area");
                    if (fidArea) setSectionHidden(fidArea, true);
                });
            }
        }

        function runCommand(command) {
            if (!frame.contentDocument) return;
            switch (command) {
                case "save":
                    if (typeof frame.contentWindow.save_to_file === "function") frame.contentWindow.save_to_file();
                    break;
                case "load":
                    clickAppElement("load_file");
                    break;
                case "fid":
                    toggleSection("fid_file_area", "button_minimize_fid_area");
                    break;
                case "spectrum":
                    clickAppElement("userfile");
                    break;
                case "pseudo3d":
                    toggleSection("pseudo3d_area", "button_minimize_preudo3d_area");
                    break;
                case "transfer":
                    toggleSection("assignment_area", "button_minimize_assignment_area");
                    break;
                case "peaks":
                    togglePanel("peak_area");
                    break;
                case "log":
                    togglePanel("log_area");
                    break;
                case "reset":
                    frame.contentWindow.location.reload();
                    break;
                default:
                    break;
            }
        }


        function switchUi(useWindowsUi) {
            window.location.href = useWindowsUi ? "index_windows_ui.html" : "index.html";
        }
        frame.addEventListener("load", styleEmbeddedApp);
        document.querySelectorAll("[data-command]").forEach(button => {
            button.addEventListener("click", () => runCommand(button.dataset.command));
        });
        document.getElementById("ui-mode-toggle").addEventListener("change", (event) => switchUi(event.target.checked));
    </script>
</body>
</html>
